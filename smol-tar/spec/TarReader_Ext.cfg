\* Second passing model: ItemsMain plus extension items of size exactly B
\* and a global header of size B + 1. MaxItems is 4 to keep the run short.
\* TLC must find no error.
CONSTANTS
    B = 4
    MaxRead = 4
    SkipChunk = 2
    MaxItems = 4
    Trail = 1
    ItemSet <- ItemsExt

SPECIFICATION Spec

INVARIANTS
    TypeOK
    PosLeNxt
    HeaderAligned
    Aligned
    OwnerState
    BodyWindow
    ExtWindow
    SkipWindow
    PaddingWindow
    NextHeader
    YieldOrder
    YieldPrefix
    ExtAttach
    DoneAfterMarker
    TruncIsErr
    ErrHasCause
    ErrSticky
    NoPanic

PROPERTIES
    Terminates
