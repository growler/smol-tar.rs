\* A path of NAME_LEN + 1 bytes: "/" and then NAME_LEN bytes without "/".
\* With the real NAME_LEN = 100 this is a path of 101 bytes.
\* PathSplitPoint (path_split_point, lib.rs:818-829) gives None, because
\* it skips index 0. PathTruncated (lib.rs:3685-3689) gives 5 > 4, so the
\* writer adds a PAX "path" record. The reader takes the path from the
\* PAX record. The model gives this path to a file and to a directory.
\* TLC must find no error.
CONSTANTS
    BLOCK = 4
    NAME_LEN = 4
    PREFIX_LEN = 6
    K = 1
    FileSizes = {0}
    DirSizes = {0}
    ConsumerDrops = FALSE
    WriterShort = FALSE
    AbsPath101 = TRUE

SPECIFICATION Spec

INVARIANTS
    NoError
    BodyOK
    YieldOK
    PaxAttach
    DoneComplete
    WriterLayout
    ReadBound

CHECK_DEADLOCK TRUE
