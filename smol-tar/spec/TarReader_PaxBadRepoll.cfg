\* A PAX header has more than one block of data, and its records are not
\* valid. ext_as_bytes (lib.rs:2697-2703) takes ext, then one of these
\* errors returns:
\* - PaxSet::parse for a local header (lib.rs:3285-3287)
\* - PaxSet::parse for a global header (lib.rs:3299-3300)
\* - the merge(...)? error of a global header (lib.rs:3304-3307)
\* - "global PAX records exceed" (lib.rs:3308-3316)
\* The state goes to Failed, and the next poll gives None.
\* The model has the parse errors. TLC must find no error.
CONSTANTS
    B = 4
    MaxRead = 4
    SkipChunk = 2
    MaxItems = 2
    Trail = 1
    ItemSet <- ItemsPaxBadRepoll

SPECIFICATION Spec

INVARIANTS
    TypeOK
    PosLeNxt
    HeaderAligned
    Aligned
    OwnerState
    BodyWindow
    ExtWindow
    SkipWindow
    PaddingWindow
    NextHeader
    YieldOrder
    YieldPrefix
    ExtAttach
    DoneAfterMarker
    TruncIsErr
    ErrHasCause
    ErrSticky
    NoPanic

PROPERTIES
    Terminates
