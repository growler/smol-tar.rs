\* write() after a dropped finish(): finish() is dropped after the marker
\* is in buf (lib.rs:4342) and before poll_close (lib.rs:4347). A later
\* write() gets Err from poll_ready. No bytes follow the marker.
\* Expected result: no error.
SPECIFICATION Spec
CONSTANTS
    BLOCK = 4
    MaxChunk = 12
    Entries <- SmallEntries
    BodyKinds = {"exact"}
    MaxFaults = 0
    MaxCancels = 1
    MaxRejects = 1
    MaxFinish = 1
    CallerKnowsCommit = TRUE
    SendAfterClose = TRUE
    RawSink = FALSE
INVARIANTS
    TypeOK
    OutIsPrefix
    MarkerOnce
    NothingAfterMarker
