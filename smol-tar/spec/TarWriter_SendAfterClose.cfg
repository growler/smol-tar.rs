\* write() after finish: poll_ready returns Err. No bytes follow the end
\* marker. Expected result: no error.
SPECIFICATION Spec
CONSTANTS
    BLOCK = 4
    MaxChunk = 12
    Entries <- SmallEntries
    BodyKinds = {"exact"}
    MaxFaults = 0
    MaxCancels = 0
    MaxRejects = 1
    MaxFinish = 1
    CallerKnowsCommit = TRUE
    SendAfterClose = TRUE
    RawSink = FALSE
INVARIANTS
    TypeOK
    OutIsPrefix
    MarkerOnce
    NothingAfterMarker
