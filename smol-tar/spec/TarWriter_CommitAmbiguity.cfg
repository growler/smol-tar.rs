\* Finding: when a write() future fails or is dropped, the caller cannot
\* see if start_send accepted the entry. A caller that sends the entry
\* again can write it two times. A caller that skips it can lose it.
\* Expected result: FinalOutput is violated.
SPECIFICATION Spec
CONSTANTS
    BLOCK = 4
    MaxChunk = 12
    Entries <- SmallEntries
    BodyKinds = {"exact"}
    MaxFaults = 0
    MaxCancels = 1
    MaxRejects = 0
    MaxFinish = 1
    CallerKnowsCommit = FALSE
    SendAfterClose = FALSE
    RawSink = FALSE
INVARIANTS
    TypeOK
    OutIsPrefix
    FinalOutput
