\* A field error after an arm moves nxt ends the stream. These arms set nxt
\* and state before later field parsing can fail: Directory
\* (lib.rs:3057), Fifo (lib.rs:3079), Device (lib.rs:3100) and Symlink
\* (lib.rs:3165). The state goes to Failed, and the next poll gives None.
\* The model uses DirBad for all four arms. TLC must find no error.
CONSTANTS
    B = 4
    MaxRead = 4
    SkipChunk = 2
    MaxItems = 2
    Trail = 1
    ItemSet <- ItemsLateFieldError

SPECIFICATION Spec

INVARIANTS
    TypeOK
    PosLeNxt
    HeaderAligned
    Aligned
    OwnerState
    BodyWindow
    ExtWindow
    SkipWindow
    PaddingWindow
    NextHeader
    YieldOrder
    YieldPrefix
    ExtAttach
    DoneAfterMarker
    TruncIsErr
    ErrHasCause
    ErrSticky
    NoPanic

PROPERTIES
    Terminates
