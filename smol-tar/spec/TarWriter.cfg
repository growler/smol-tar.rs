\* Main model. All properties pass.
\* Caller: write() with drops and retries after errors, direct start_send
\* then poll_flush or poll_close, finish() before or after the last entry,
\* finish() two times (the second one does not close the underlying
\* writer again), write() and start_send after finish.
SPECIFICATION Spec
CONSTANTS
    BLOCK = 4
    MaxChunk = 12
    Entries <- MainEntries
    BodyKinds = {"exact", "short", "long"}
    MaxFaults = 3
    MaxCancels = 3
    MaxRejects = 2
    MaxFinish = 2
    CallerKnowsCommit = TRUE
    SendAfterClose = TRUE
    RawSink = TRUE
INVARIANTS
    TypeOK
    PosLenOK
    TotalIsOutput
    OutIsPrefix
    BoundaryAligned
    BodyNotLonger
    MarkerOnce
    NothingAfterMarker
    FinalWellFormed
    FinalOutput
    ShortErrOnce
    CloseOnce
    StateOK
PROPERTIES
    SpecSanityReject
    FinishCompletes
    Terminates
