\* Main model of the TarWriter -> TarReader round trip. AbsPath101 = TRUE
\* keeps the path "/" and NAME_LEN bytes in the input (see IsAbsShape).
\* BLOCK is a scaled BLOCK_SIZE. The PAX data lengths (1..7) give data
\* below, equal to and above one block.
CONSTANTS
    BLOCK = 4
    NAME_LEN = 4
    PREFIX_LEN = 6
    K = 2
    FileSizes = {0, 3, 4, 5}
    DirSizes = {0, 2}
    ConsumerDrops = TRUE
    WriterShort = FALSE
    AbsPath101 = TRUE

SPECIFICATION Spec

INVARIANTS
    NoError
    BodyOK
    YieldOK
    PaxAttach
    DoneComplete
    WriterLayout
    ReadBound

PROPERTIES
    ReachesDone

CHECK_DEADLOCK TRUE
