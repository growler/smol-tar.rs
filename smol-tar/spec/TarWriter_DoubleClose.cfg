\* finish() two times: the second finish() writes no second marker and
\* returns Ok at once (lib.rs:4333-4335). It does not call poll_close on
\* the underlying writer again. Expected result: no error.
SPECIFICATION Spec
CONSTANTS
    BLOCK = 4
    MaxChunk = 12
    Entries <- SmallEntries
    BodyKinds = {"exact"}
    MaxFaults = 0
    MaxCancels = 0
    MaxRejects = 0
    MaxFinish = 2
    CallerKnowsCommit = TRUE
    SendAfterClose = FALSE
    RawSink = FALSE
INVARIANTS
    TypeOK
    MarkerOnce
    CloseOnce
    StateOK
