\* Main model of the reader. TLC must find no error.
\* ItemsMain has no bad PAX payload larger than one block and no DirBad.
CONSTANTS
    B = 4
    MaxRead = 4
    SkipChunk = 2
    MaxItems = 5
    Trail = 1
    ItemSet <- ItemsMain

SPECIFICATION Spec

INVARIANTS
    TypeOK
    PosLeNxt
    HeaderAligned
    Aligned
    OwnerState
    BodyWindow
    ExtWindow
    SkipWindow
    PaddingWindow
    NextHeader
    YieldOrder
    YieldPrefix
    ExtAttach
    DoneAfterMarker
    TruncIsErr
    ErrHasCause
    ErrSticky
    NoPanic

PROPERTIES
    Terminates
