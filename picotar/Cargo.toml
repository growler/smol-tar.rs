[package]
name = "picotar"
version.workspace = true
edition = "2021"
description = "Feature-gated example tar CLI built on top of smol-tar"
publish = false

[[bin]]
name = "picotar"
path = "src/main.rs"

[features]
default = ["smol"]
smol = ["dep:smol", "smol-tar/smol", "smol-tar-fs/smol", "async-compression/futures-io"]
tokio = [
    "dep:tokio",
    "dep:tokio-stream",
    "smol-tar/tokio",
    "smol-tar-fs/tokio",
    "async-compression/tokio",
]

[dependencies]
async-compression = { version = "0.4", features = ["gzip", "xz", "zstd"] }
futures = "0.3"
smol = { version = "2.0", optional = true }
smol-tar.workspace = true
smol-tar-fs.workspace = true
tokio = { version = "1", optional = true, features = ["fs", "io-std", "io-util", "rt"] }
tokio-stream = { version = "0.1", optional = true }

[dev-dependencies]
async-compression = { version = "0.4", features = ["futures-io", "gzip", "xz", "zstd"] }
futures-lite = "2.6"
