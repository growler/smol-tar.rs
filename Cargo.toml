[workspace]
resolver = "2"
members = ["smol-tar", "smol-tar-fs", "picotar"]
exclude = ["bench", "fuzz", "xtask"]

[workspace.package]
version = "0.1.11"

[workspace.dependencies]
smol-tar = { version = "0.1.11", path = "smol-tar", default-features = false }
smol-tar-fs = { version = "0.1.11", path = "smol-tar-fs", default-features = false }
