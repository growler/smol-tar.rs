[package]
name = "smol-tar"
version = "0.1.10"
edition = "2021"
authors = ["Alexey Naidyonov <alexey.naidyonov@gmail.com>"]
description = "Async streaming tar reader and writer (ustar, pax, GNU) as a Stream and Sink for smol, futures-io, or tokio"
homepage = "https://github.com/growler/smol-tar.rs"
repository = "https://github.com/growler/smol-tar.rs"
documentation = "https://docs.rs/smol-tar"
license = "MIT"
keywords = ["tar", "async", "archive", "tokio", "smol"]
categories = ["compression", "asynchronous", "encoding"]
readme = "README.md"
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
]
rust-version = "1.85"

[package.metadata.docs.rs]
features = ["futures", "fs"]

[features]
default = ["smol"]
smol = ["dep:async-lock", "dep:futures-io"]
tokio = ["dep:tokio", "dep:tokio-stream"]
futures = ["dep:futures"]
fs = ["dep:rustix", "dep:blocking", "dep:libc"]

[dependencies]
futures-core = "0.3"
futures-sink = "0.3"
pin-project-lite = "0.2"
async-lock = { version = "3.4", optional = true }
futures-io = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["fs", "io-util", "rt"] }
tokio-stream = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
blocking = { version = "1.6", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"], optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
smol = "2.0"
futures = "0.3"
static_assertions = "1.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
async-compression = { version = "0.4", features = ["futures-io", "gzip"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
libc = "0.2"

[[example]]
name = "read"
required-features = ["smol"]

[[example]]
name = "read_tokio"
required-features = ["tokio"]

[[example]]
name = "read_gz"
required-features = ["smol"]

[[example]]
name = "write"
required-features = ["smol"]

[[example]]
name = "filter"
required-features = ["smol"]

[[example]]
name = "pack"
required-features = ["smol", "fs"]

[[example]]
name = "unpack"
required-features = ["smol", "fs"]
